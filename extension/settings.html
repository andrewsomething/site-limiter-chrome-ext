<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Limiter — Settings</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.25rem;
      }
      .page-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
      }
      .card {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        margin-bottom: 1.5rem;
      }
      .settings-section {
        border-bottom: none;
        border-radius: 0;
      }
      .settings-section:not(:last-child) {
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <img src="icons/icon32.png" width="24" height="24" alt="" style="border-radius: 4px" />
        <h1>Site Limiter</h1>
      </div>
      <nav class="page-nav">
        <a href="sites.html">Sites</a>
        <a href="settings.html" class="active">Settings</a>
        <a href="stats.html">Stats</a>
      </nav>

      <div class="card">
        <p class="settings-defaults-hint" style="padding: 12px 16px 0; margin: 0">
          Applied to sites without custom limits
        </p>
        <div class="settings-section">
          <label for="watch-limit-minutes">Default watch limit</label>
          <div class="input-row">
            <input id="watch-limit-minutes" type="number" min="1" step="1" value="15" />
            <span class="unit">minutes</span>
          </div>
        </div>
        <div class="settings-section">
          <label for="cooldown-hours">Default cooldown duration</label>
          <div class="input-row">
            <input id="cooldown-hours" type="number" min="0.1" step="0.5" value="3" />
            <span class="unit">hours</span>
          </div>
        </div>
        <div class="settings-section">
          <div class="save-row">
            <button id="save-btn" class="btn btn-primary">Save</button>
            <span id="save-feedback">✓ Saved</span>
          </div>
        </div>
      </div>
    </div>

    <script src="lib/utils.js"></script>
    <script src="lib/ui.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
