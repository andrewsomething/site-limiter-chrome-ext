<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Limiter — Sites</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.25rem;
      }
      .page-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
      }
      .card {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        margin-bottom: 1.5rem;
      }
      .card-title {
        padding: 12px 16px 6px;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      .site-toggle-row:last-child {
        border-bottom: none;
      }
      .add-form {
        border-top: 1px solid var(--border);
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <img src="icons/icon32.png" width="24" height="24" alt="" style="border-radius: 4px" />
        <h1>Site Limiter</h1>
      </div>
      <nav class="page-nav">
        <a href="sites.html" class="active">Sites</a>
        <a href="settings.html">Settings</a>
        <a href="stats.html">Stats</a>
      </nav>

      <div class="card">
        <div class="card-title">Default sites</div>
        <div id="default-sites-list"></div>
      </div>

      <div class="card">
        <div class="card-title">Custom sites</div>
        <div id="custom-sites-list"></div>
        <div class="add-form">
          <label>Name</label>
          <input id="new-site-name" type="text" placeholder="e.g. Hacker News" />
          <label>URL pattern</label>
          <input id="new-site-pattern" type="text" placeholder="e.g. news.ycombinator.com/*" />
          <button id="add-site-btn" class="btn btn-primary" style="width: 100%">Add site</button>
        </div>
      </div>
    </div>

    <script src="lib/utils.js"></script>
    <script src="lib/page-utils.js"></script>
    <script src="sites.js"></script>
  </body>
</html>
