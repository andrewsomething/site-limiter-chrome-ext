<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Limiter — Stats</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.25rem;
      }
      .page-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 2rem;
        align-items: center;
      }
      .pill-group {
        display: flex;
        background: var(--bg-input);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
      }
      .pill {
        padding: 5px 14px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
        white-space: nowrap;
      }
      .pill.active {
        background: var(--accent);
        color: #fff;
      }
      .summary {
        display: flex;
        gap: 16px;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .summary-card {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1rem 1.5rem;
        flex: 1;
        min-width: 140px;
        box-shadow: var(--shadow);
      }
      .summary-card .value {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--accent);
      }
      .summary-card .label {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .charts {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .chart-card {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        box-shadow: var(--shadow);
      }
      .chart-card h2 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
      }
      .chart-wrap {
        position: relative;
        height: 220px;
      }
      .empty {
        text-align: center;
        color: var(--text-muted);
        padding: 3rem 1rem;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <img src="icons/icon32.png" width="24" height="24" alt="" style="border-radius: 4px" />
      <h1>Site Limiter</h1>
    </div>
    <nav class="page-nav">
      <a href="sites.html">Sites</a>
      <a href="settings.html">Settings</a>
      <a href="stats.html" class="active">Stats</a>
    </nav>

    <div class="controls">
      <div class="pill-group" id="range-pills">
        <button class="pill" data-days="7">7 days</button>
        <button class="pill active" data-days="14">14 days</button>
        <button class="pill" data-days="30">30 days</button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div class="value" id="sum-time">—</div>
        <div class="label">Total time</div>
      </div>
      <div class="summary-card">
        <div class="value" id="sum-blocks">—</div>
        <div class="label">Total blocks</div>
      </div>
      <div class="summary-card">
        <div class="value" id="sum-avg">—</div>
        <div class="label">Avg / day</div>
      </div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h2>Time Spent</h2>
        <div class="chart-wrap"><canvas id="chart-time"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>Blocks Triggered</h2>
        <div class="chart-wrap"><canvas id="chart-blocks"></canvas></div>
      </div>
    </div>

    <script src="stats.bundle.js"></script>
  </body>
</html>
