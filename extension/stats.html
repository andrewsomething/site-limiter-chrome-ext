<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Limiter — Stats</title>
    <style>
      :root {
        --accent: #6366f1;
        --accent-soft: #818cf8;
        --bg: #f8f8fc;
        --bg-raised: #ffffff;
        --bg-input: #f0f0f6;
        --border: #e2e2ee;
        --text: #1a1a2e;
        --text-muted: #64648a;
        --radius: 12px;
        --shadow: 0 2px 12px rgba(99, 102, 241, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13131f;
          --bg-raised: #1e1e2e;
          --bg-input: #252538;
          --border: #2e2e4a;
          --text: #e8e8f8;
          --text-muted: #8888aa;
          --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 2rem;
      }
      header img {
        width: 36px;
        height: 36px;
        border-radius: 8px;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 700;
      }
      header span {
        color: var(--text-muted);
        font-size: 1rem;
        font-weight: 400;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 2rem;
        align-items: center;
      }
      .pill-group {
        display: flex;
        background: var(--bg-input);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
      }
      .pill {
        padding: 5px 14px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
        white-space: nowrap;
      }
      .pill.active {
        background: var(--accent);
        color: #fff;
      }
      .summary {
        display: flex;
        gap: 16px;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .summary-card {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.5rem;
        flex: 1;
        min-width: 140px;
        box-shadow: var(--shadow);
      }
      .summary-card .value {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--accent);
      }
      .summary-card .label {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .charts {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .chart-card {
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        box-shadow: var(--shadow);
      }
      .chart-card h2 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
      }
      .chart-wrap {
        position: relative;
        height: 220px;
      }
      .empty {
        text-align: center;
        color: var(--text-muted);
        padding: 3rem 1rem;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <img id="header-icon" src="icons/icon48.png" alt="" />
      <h1>Site Limiter <span>— Usage Stats</span></h1>
    </header>

    <div class="controls">
      <div class="pill-group" id="site-pills"></div>
      <div class="pill-group" id="range-pills">
        <button class="pill" data-days="7">7 days</button>
        <button class="pill active" data-days="14">14 days</button>
        <button class="pill" data-days="30">30 days</button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div class="value" id="sum-time">—</div>
        <div class="label">Total time</div>
      </div>
      <div class="summary-card">
        <div class="value" id="sum-blocks">—</div>
        <div class="label">Total blocks</div>
      </div>
      <div class="summary-card">
        <div class="value" id="sum-avg">—</div>
        <div class="label">Avg / day</div>
      </div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h2>Time Spent</h2>
        <div class="chart-wrap"><canvas id="chart-time"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>Blocks Triggered</h2>
        <div class="chart-wrap"><canvas id="chart-blocks"></canvas></div>
      </div>
    </div>

    <script src="stats.bundle.js"></script>
  </body>
</html>
