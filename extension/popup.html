<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Limiter</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        width: 340px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      /* ── Header ────────────────────────────────────────────────────────────── */
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-raised);
      }
      header h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      /* ── Tabs ───────────────────────────────────────────────────────────────── */
      .tabs {
        display: flex;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
      }
      .tab-btn {
        flex: 1;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
        padding: 9px 4px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .tab-btn:hover {
        color: var(--text);
      }
      .tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      /* ── Status tab ─────────────────────────────────────────────────────────── */
      .site-row {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-raised);
      }
      .site-row:last-child {
        border-bottom: none;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
      }
      .site-name {
        font-size: 13px;
        font-weight: 600;
      }
      .badge {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .badge.ok {
        background: var(--ok-bg);
        color: var(--ok-text);
      }
      .badge.blocked {
        background: var(--err-bg);
        color: var(--err-text);
      }
      .time-label {
        color: var(--text-muted);
        font-size: 11px;
        margin-bottom: 6px;
      }
      .progress-track {
        height: 5px;
        background: var(--bg-input);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      .cooldown-text {
        color: var(--err-muted);
        font-size: 11px;
        margin-top: 6px;
      }
      .empty-status {
        padding: 28px 16px;
        color: var(--text-faint);
        font-size: 13px;
        text-align: center;
        background: var(--bg-raised);
      }
      .footer-row {
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--border);
        background: var(--bg);
      }
      .footer-row-right {
        display: flex;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" width="20" height="20" alt="" style="border-radius: 4px" />
      <h1>Site Limiter</h1>
      <button id="pause-btn" class="limits-btn" title="Pause tracking" style="margin-left: auto">
        ⏸
      </button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="status">Status</button>
      <button class="tab-btn" data-tab="sites">Sites</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <!-- STATUS TAB -->
    <div id="tab-status" class="tab-panel active">
      <div id="status-list"></div>
      <div class="footer-row">
        <button id="reset-all-btn" class="btn btn-danger">Reset all</button>
        <button id="stats-link" class="btn btn-secondary">View Stats →</button>
      </div>
    </div>

    <!-- SITES TAB -->
    <div id="tab-sites" class="tab-panel">
      <div class="section-label">Default sites</div>
      <div id="default-sites-list"></div>
      <div class="section-label" style="margin-top: 4px">Custom sites</div>
      <div id="custom-sites-list"></div>
      <div style="padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg)">
        <button id="manage-sites-link" class="btn btn-secondary" style="width: 100%">
          Manage custom sites →
        </button>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-panel">
      <p class="settings-defaults-hint">Applied to sites without custom limits</p>
      <div class="settings-section">
        <label for="watch-limit-minutes">Default watch limit</label>
        <div class="input-row">
          <input id="watch-limit-minutes" type="number" min="1" step="1" value="15" />
          <span class="unit">minutes</span>
        </div>
      </div>
      <div class="settings-section">
        <label for="cooldown-hours">Default cooldown duration</label>
        <div class="input-row">
          <input id="cooldown-hours" type="number" min="0.1" step="0.5" value="3" />
          <span class="unit">hours</span>
        </div>
      </div>
      <div class="settings-section pause-section">
        <div class="pause-row">
          <div>
            <div class="pause-label">Pause tracking</div>
            <div class="pause-desc">Temporarily stop time from accumulating on all sites</div>
          </div>
          <button id="pause-toggle-btn" class="btn btn-secondary">Pause</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="save-row">
          <button id="save-btn" class="btn btn-primary">Save</button>
          <span id="save-feedback">✓ Saved</span>
          <button id="settings-link" class="btn btn-secondary" style="margin-left: auto">
            Open full page →
          </button>
        </div>
      </div>
    </div>

    <script src="lib/utils.js"></script>
    <script src="lib/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
