<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Shorts Limiter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #272727;
    }

    header span { font-size: 20px; }
    header h1 { font-size: 14px; font-weight: 600; color: #fff; }

    .section { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; }

    /* Status badge */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .badge.ok   { background: #1e3a1e; color: #4caf50; }
    .badge.blocked { background: #3a1e1e; color: #ff5252; }

    .time-label { color: #aaa; font-size: 12px; }

    /* Progress bar */
    .progress-track {
      height: 6px;
      background: #272727;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #ff0000;
      border-radius: 3px;
      transition: width .4s ease;
    }

    .cooldown-info {
      margin-top: 10px;
      font-size: 12px;
      color: #ff9999;
      text-align: center;
    }

    /* Settings */
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="number"] {
      flex: 1;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      padding: 7px 10px;
      outline: none;
    }
    input[type="number"]:focus { border-color: #666; }

    .unit { color: #aaa; font-size: 13px; white-space: nowrap; }

    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #ff0000; color: #fff; }
    .btn-ghost   { background: #1f1f1f; color: #aaa; border: 1px solid #333; }
    .btn-danger  { background: #3a1e1e; color: #ff5252; border: 1px solid #5c2a2a; }

    .save-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    #save-feedback { color: #4caf50; font-size: 12px; display: none; }

    footer {
      padding: 10px 16px;
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <header>
    <span>⏱️</span>
    <h1>YouTube Shorts Limiter</h1>
  </header>

  <!-- Status section -->
  <div class="section">
    <div class="status-row">
      <span id="status-badge" class="badge ok">Active</span>
      <span id="time-label" class="time-label">0:00 / 15:00</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill" style="width:0%"></div>
    </div>
    <p id="cooldown-info" class="cooldown-info" style="display:none"></p>
  </div>

  <!-- Settings section -->
  <div class="section">
    <label for="watch-limit-minutes">Watch limit per session</label>
    <div class="input-row">
      <input id="watch-limit-minutes" type="number" min="1" step="1" value="15" />
      <span class="unit">minutes</span>
    </div>
    <label for="cooldown-hours" style="margin-top:10px;">Cooldown duration after limit is reached</label>
    <div class="input-row">
      <input id="cooldown-hours" type="number" min="0.1" step="0.5" value="3" />
      <span class="unit">hours</span>
    </div>
    <div class="save-row">
      <button id="save-btn" class="btn btn-primary">Save</button>
      <span id="save-feedback">✓ Saved</span>
    </div>
  </div>

  <!-- Reset section -->
  <footer>
    <button id="reset-btn" class="btn btn-danger">Reset timer</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
